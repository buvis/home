# Scheduled shell hooks, run visibly before the first prompt of an interactive shell
# by ~/bin/run-shell-hooks. Machine-local additions and overrides go in
# ~/.local/.config/shell-hooks/tasks.yaml (same shape, untracked); a local entry may
# override any key here or set `enabled: false`. every: <N>(m|h|d|w). `run` is one
# line, a list, or a `|` block: several lines run in order, each under a step header,
# stopping at the first failure. `icon` is optional and marks the task when it runs.
tasks:
  gita-discover:
    icon: 📂
    every: 1d
    # Stop at repository roots: nested test fixtures are not portfolio repos.
    # gita add preserves existing entries and adds only missing paths.
    run: >-
      GITA_PROJECT_HOME="$HOME/.local/.config"
      find "$HOME/git/src" -type d
      \( -name worktrees -o -name .local \) -prune -o
      -type d -exec test -e '{}/.git' \;
      -prune -exec gita add {} +
  gita-pull:
    icon: 🔄
    every: 1d
    run: gita pull
  brew-dump:
    icon: 🍺
    every: 1d
    run:
      - mkdir -p ~/.local/.config/brew
      - brew bundle dump --force --formula --cask --tap --file ~/.local/.config/brew/Brewfile
