[tools]
"cargo:rumdl" = "latest"
"cargo:zoxide" = "latest"
"github:neovim/neovim" = "latest"
"lazygit" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:pake-cli" = "latest"
"npm:pnpm" = { version = "latest", allow_builds = ["pnpm"] }
"npm:postman-cli" = "latest"
"npm:tree-sitter-cli" = { version = "latest", allow_builds = ["tree-sitter-cli"] }
# pipx tools run on uv-managed python so mise python bumps can't break their venvs.
# sysup keeps them current: `uv python upgrade` handles patches in place, and the
# pipx-python step moves every `--managed-python --python X.Y` pin to the global
# python minor below (reverting any tool that fails to install on it).
"pipx:Yapf" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:autopep8" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:beets" = { version = "latest", extras = "discogs,lastgenre", uvx_args = "--managed-python --python 3.14" }
"pipx:black" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:buvis-gems" = { version = "latest", extras = "all", uvx_args = "--managed-python --python 3.14" }
"pipx:gita" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:llm" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:poetry" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:potrace-cli" = { version = "latest", uvx_args = "--managed-python --python 3.14 --with setuptools<81" }
"pipx:pre-commit" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:pybooklid" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:pynvim" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:ruff" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:showboat" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:yamllint" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
"pipx:yt-dlp" = { version = "latest", uvx_args = "--managed-python --python 3.14" }
ast-grep = "latest"
awscli = { version = "latest", symlink_bins = "true" }
deno = "latest"
github-cli = "latest"
helm = "latest"
herdr = "latest"
node = "latest"
python = "3.15.0"
rust = "latest"
uv = "latest"
ripgrep = "latest"
bun = "latest"
yq = "latest"

[settings]
experimental = true
# own package: take releases immediately (mise's default release-age delay otherwise hides them for a day+)
minimum_release_age_excludes = ["pipx:buvis-gems"]
