# Personal sysup entries, deep-merged over the bundled default.yaml.

# Push alerts go to ntfy, the same server and topic as the agents' alerts
# (~/.claude/settings.json sets NTFY_URL and NTFY_TOPIC only for agent
# sessions, so a sysup run from a plain terminal needs them here). The server
# refuses anonymous posts (HTTP 403, 2026-11-16), so sysup signs in with the
# user:password in credentials_file. It is a secret: it lives under
# ~/.local/secrets, never in dotfiles. Without it, sysup still shows attention,
# only the push fails.
ntfy:
  url: https://ntfy.buvis.net
  topic: claude
  credentials_file: ~/.local/secrets/ntfy-credentials

commands:
  # rustup is the Rust toolchain manager (mise does not manage rust). `when.os`
  # takes one value, so each OS gets its own key. Order 55: before mise, so
  # `cargo:` tools build with the fresh toolchain.
  #
  # `rustup` (darwin) duplicates the bundled default (gems 247c251c) under the
  # same key, so it merges harmlessly. Installed gems 0.16.0 predates that
  # commit and has no rustup step. Delete this key once a gems release contains it.
  rustup:
    order: 55
    when: { os: darwin, check: rustup }
    steps:
      - rustup update

  rustup-linux:
    order: 55
    when: { os: linux, check: rustup }
    steps:
      - rustup update

  rustup-win32:
    order: 55
    when: { os: win32, check: rustup }
    steps:
      - rustup update

  # Kiro CLI's background updater left every update DMG mounted (12 stale
  # "Kiro CLI" volumes on 2026-10-17), so it is off via
  # `kiro-cli settings app.disableAutoupdates true` and sysup updates it instead,
  # ejecting whatever the updater leaves behind.
  kiro-cli:
    order: 55
    when: { os: darwin, check: kiro-cli }
    steps:
      - [kiro-cli, update, --non-interactive]
      - - sh
        - -ec
        - |
          for v in "/Volumes/Kiro CLI"*; do
            if [ -d "$v" ]; then hdiutil detach "$v"; fi
          done

  # Herdr app mods (replaces the bundled herdr-mods steps, same key and order 78).
  # hmod updates unedited mods it has approved before; hmod-merge (Herdr home
  # bin/) then 3-way merges upstream into edited mods, and checks the forks in
  # forks.json. Anything that needs a decision (a first update, a fork whose
  # upstream moved, a merge conflict) goes to stderr with the command to run,
  # and the step fails, so sysup's attention shows it until it is handled.
  # (The herdr-plugins step for the retired Herdr TUI was removed 2026-11-16:
  # ~/.config/herdr is gone since 2026-11-08, so it could only fail.)
  herdr-mods:
    order: 78
    when: { os: darwin, check: herdr-app }
    steps:
      - |
        bin="$HOME/.config/herdr-app/bin"
        [ -x "$bin/hmod" ] || { echo "hmod not installed, skipping"; exit 0; }
        herdr-app status >/dev/null 2>&1 || { echo "Herdr not running, skipping"; exit 0; }
        rc=0
        "$bin/hmod" update --all || rc=1
        "$bin/hmod-merge" --auto || rc=1
        exit $rc

  # The dotfiles remote is public, so nothing gets tracked without a decision.
  # glean (agent-skills) lists untracked dotfiles that no ledger verdict covers,
  # such as a mod newly added to ~/.config/herdr-app. Any listed path fails this
  # step: run /glean to track, encrypt or ledger each one. Runs last.
  dotfiles-drift:
    order: 90
    when: { check: jq }
    steps:
      - - sh
        - -ec
        - |
          scan="$HOME/.agents/skills/glean/scripts/glean.py"
          if [ ! -f "$scan" ]; then echo "glean not installed, skipping"; exit 0; fi
          out=$(python3 "$scan" scan)
          printf '%s\n' "$out" | jq -r '(.candidates + .resurfaced)[] | .path'
          n=$(printf '%s\n' "$out" | jq '.counts.new + .counts.resurfaced')
          if [ "$n" -ne 0 ]; then echo "$n untracked dotfile(s) need a glean verdict: run /glean"; exit 1; fi
          echo "no untracked dotfiles without a verdict"
