# Personal sysup entries, deep-merged over the bundled default.yaml.

commands:
  # herdr's plugins.json holds machine-specific absolute paths, so dotfiles
  # track plugins.txt (owner/repo per line) instead. Install each listed plugin
  # whose clone is missing or behind GitHub HEAD, then rewrite plugins.txt from
  # plugins.json so plugins installed on this machine get recorded too.
  # ponytail: enabled/disabled state stays per machine.
  herdr-plugins:
    order: 80
    when: { check: herdr }
    steps:
      - - sh
        - -ec
        - |
          cfg="$HOME/.config/herdr"
          touch "$cfg/plugins.txt"
          while read -r repo; do
            [ -n "$repo" ] || continue
            # sets $1 = installed commit, $2 = clone dir (both empty if absent);
            # no brace expansion here, the buvis loader reads it as an env var
            set -- "" ""
            if [ -f "$cfg/plugins.json" ]; then
              set -- $(jq -r --arg r "$repo" '.[] | select((.source.owner + "/" + .source.repo) == $r)
                | "\(.source.resolved_commit) \(.source.managed_path)"' "$cfg/plugins.json") "" ""
            fi
            head=$(git ls-remote "https://github.com/$repo" HEAD | cut -f1)
            if [ -n "$1" ] && [ -d "$2" ] && [ "$1" = "$head" ]; then continue; fi
            herdr plugin install -y "$repo" </dev/null
          done < "$cfg/plugins.txt"
          [ -f "$cfg/plugins.json" ] || exit 0
          jq -r '.[] | select(.source.kind == "github") | "\(.source.owner)/\(.source.repo)"' \
            "$cfg/plugins.json" | sort -f > "$cfg/plugins.txt"
