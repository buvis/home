# Personal sysup entries, deep-merged over the bundled default.yaml.

commands:
  # rustup is the Rust toolchain manager (mise does not manage rust). `when.os`
  # takes one value, so each OS gets its own key. Order 55: before mise, so
  # `cargo:` tools build with the fresh toolchain.
  #
  # `rustup` (darwin) duplicates the bundled default (gems 247c251c) under the
  # same key, so it merges harmlessly. Installed gems 0.16.0 predates that
  # commit and has no rustup step. Delete this key once a gems release contains it.
  rustup:
    order: 55
    when: { os: darwin, check: rustup }
    steps:
      - rustup update

  rustup-linux:
    order: 55
    when: { os: linux, check: rustup }
    steps:
      - rustup update

  rustup-win32:
    order: 55
    when: { os: win32, check: rustup }
    steps:
      - rustup update

  # Kiro CLI's background updater left every update DMG mounted (12 stale
  # "Kiro CLI" volumes on 2026-10-17), so it is off via
  # `kiro-cli settings app.disableAutoupdates true` and sysup updates it instead,
  # ejecting whatever the updater leaves behind.
  kiro-cli:
    order: 55
    when: { os: darwin, check: kiro-cli }
    steps:
      - [kiro-cli, update, --non-interactive]
      - - sh
        - -ec
        - |
          for v in "/Volumes/Kiro CLI"*; do
            if [ -d "$v" ]; then hdiutil detach "$v"; fi
          done

  # herdr's plugins.json holds machine-specific absolute paths, so dotfiles
  # track plugins.txt (owner/repo per line) instead. Install each listed plugin
  # whose clone is missing or behind GitHub HEAD, then rewrite plugins.txt from
  # plugins.json so plugins installed on this machine get recorded too.
  # ponytail: enabled/disabled state stays per machine.
  herdr-plugins:
    order: 80
    when: { check: herdr }
    steps:
      - - sh
        - -ec
        - |
          cfg="$HOME/.config/herdr"
          touch "$cfg/plugins.txt"
          while read -r repo; do
            [ -n "$repo" ] || continue
            # sets $1 = installed commit, $2 = clone dir (both empty if absent);
            # no brace expansion here, the buvis loader reads it as an env var
            set -- "" ""
            if [ -f "$cfg/plugins.json" ]; then
              set -- $(jq -r --arg r "$repo" '.[] | select((.source.owner + "/" + .source.repo) == $r)
                | "\(.source.resolved_commit) \(.source.managed_path)"' "$cfg/plugins.json") "" ""
            fi
            head=$(git ls-remote "https://github.com/$repo" HEAD | cut -f1)
            if [ -n "$1" ] && [ -d "$2" ] && [ "$1" = "$head" ]; then continue; fi
            herdr plugin install -y "$repo" </dev/null
          done < "$cfg/plugins.txt"
          [ -f "$cfg/plugins.json" ] || exit 0
          jq -r '.[] | select(.source.kind == "github") | "\(.source.owner)/\(.source.repo)"' \
            "$cfg/plugins.json" | sort -f > "$cfg/plugins.txt"

  # The dotfiles remote is public, so nothing gets tracked without a decision.
  # glean (agent-skills) lists untracked dotfiles that no ledger verdict covers,
  # such as a mod newly added to ~/.config/herdr-app. Any listed path fails this
  # step: run /glean to track, encrypt or ledger each one. Runs last.
  dotfiles-drift:
    order: 90
    when: { check: jq }
    steps:
      - - sh
        - -ec
        - |
          scan="$HOME/.agents/skills/glean/scripts/glean.py"
          if [ ! -f "$scan" ]; then echo "glean not installed, skipping"; exit 0; fi
          out=$(python3 "$scan" scan)
          printf '%s\n' "$out" | jq -r '(.candidates + .resurfaced)[] | .path'
          n=$(printf '%s\n' "$out" | jq '.counts.new + .counts.resurfaced')
          if [ "$n" -ne 0 ]; then echo "$n untracked dotfile(s) need a glean verdict: run /glean"; exit 1; fi
          echo "no untracked dotfiles without a verdict"
