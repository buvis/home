onboarding = false

[worktrees]
directory = "~/git/src/worktrees"

[keys]
prefix = "ctrl+q"
previous_tab = "prefix+left"
focus_pane_left = "prefix+right"
split_horizontal = "prefix+s"
split_vertical = "prefix+v"

# >>> herdr-agent-activity (managed: remove with the plugin's uninstall action) >>>
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [{ token = "$rsact_summary", fg = "#89b4fa", rules = [{ contains = "subagent", fg = "#f9e2af" }, { contains = "bg", fg = "#89b4fa" }, { contains = "monitor", fg = "#89b4fa" }, { starts_with = "loop", fg = "#cba6f7" }, { starts_with = "next", fg = "#cba6f7" }] }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$rsact_summary", fg = "#89b4fa", rules = [{ contains = "subagent", fg = "#f9e2af" }, { contains = "bg", fg = "#89b4fa" }, { contains = "monitor", fg = "#89b4fa" }, { starts_with = "loop", fg = "#cba6f7" }, { starts_with = "next", fg = "#cba6f7" }] }],
]
# <<< herdr-agent-activity <<<
